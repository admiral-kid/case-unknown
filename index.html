,surprised:`assets/characters/clerk/surprised.png`,concerned:`assets/characters/clerk/concerned.png`},group:`frontline`}],scenes:[{id:`bakery`,name:`こむぎ堂 売り場`,background:`assets/backgrounds/bakery.jpg`,tone:`#2a2118`},{id:`bakery_kitchen`,name:`こむぎ堂 厨房`,background:`assets/backgrounds/bakery_kitchen.jpg`,tone:`#231d18`}],evidence:[{id:`ev_sales`,type:`data`,title:`売上`,headline:`前年比 −15%`,description:`4月から毎月、前の年より15%ほど少ない。1日の売上は、およそ10万円から8.5万円になった。`,source:`売上日報`,tags:[`売上`]},{id:`ev_request`,type:`testimony`,title:`依頼：チラシで客を呼び戻す`,headline:`「チラシを配って、離れたお客さんを呼び戻したい」`,description:`小松さんの依頼。駅前のコンビニに流れた客を、チラシで呼び戻したいと考えている。`,source:`baker`,tags:[`依頼`]},{id:`ev_goal`,type:`testimony`,title:`チラシは手段`,headline:`「売上が去年くらいに戻れば、それでいい」`,description:`チラシにこだわりがあるわけではない。小松さんが本当に取り戻したいのは売上だ。`,source:`baker`,tags:[`依頼`,`目的`]},{id:`ev_rival`,type:`testimony`,title:`店主の見立て`,headline:`「駅前のコンビニに客を取られた」`,description:`春に駅前にコンビニができた。朝のパンを、そちらで買う人が増えたのではないかと小松さんは考えている。ただし、数えたわけではない。`,source:`baker`,tags:[`見立て`]},{id:`ev_changes`,type:`testimony`,title:`春に変えたこと`,headline:`「キャッシュレス決済を入れたくらい」`,description:`春、若いお客さんの声を受けて、レジにキャッシュレス決済の端末を入れた。小松さんが思いつく変化はそれくらい。`,source:`baker`,tags:[`変化`]},{id:`ev_customers`,type:`data`,title:`客数（レジ通過）`,headline:`1日 約200人（前年比 ±0%）`,description:`レジを通った人数は、1日およそ200人。前の年と、ほとんど変わっていない。`,source:`レジの記録`,tags:[`客数`]},{id:`ev_items`,type:`data`,title:`1人が買う数`,headline:`2.0点 → 1.7点`,description:`1枚のレシートに載るパンの数。4月から、平均2.0点が1.7点に減っている。`,source:`レシートの集計`,tags:[`購入点数`]},{id:`ev_price`,type:`data`,title:`1点の値段`,headline:`平均250円（変わらず）`,description:`パン1点あたりの平均の値段は、前の年と同じ。値上げも値下げもしていない。高いパンが売れなくなったわけでもない。`,source:`レシートの集計`,tags:[`値段`]},{id:`ev_regulars`,type:`testimony`,title:`常連さんは変わらない`,headline:`「朝の常連さんは、みんな毎日来てます」`,description:`レジに立つ早瀬さんの実感。常連の顔ぶれは変わらず、コンビニに流れた人は思い当たらない。`,source:`clerk`,tags:[`客数`]},{id:`ev_shelf`,type:`testimony`,title:`レジ横の焼きたて棚`,headline:`「春に、レジ横の焼きたて棚をやめたんです」`,description:`決済の端末を置く場所がなく、ラスクやミニクロワッサンを並べていたレジ横の小さな棚を片付けた。`,source:`clerk`,tags:[`変化`,`売り場`]},{id:
