racters/clerk/neutral.png`,smile:`assets/characters/clerk/smile.png`,surprised:`assets/characters/clerk/surprised.png`,concerned:`assets/characters/clerk/concerned.png`},group:`frontline`}],scenes:[{id:`bakery`,name:`こむぎ堂 売り場`,background:`assets/backgrounds/bakery.jpg`,tone:`#2a2118`},{id:`bakery_kitchen`,name:`こむぎ堂 厨房`,background:`assets/backgrounds/bakery_kitchen.jpg`,tone:`#231d18`}],evidence:[{id:`ev_sales`,type:`data`,title:`1日の売上`,headline:`4月から 10万円 → 8.5万円`,description:`4月から毎月、前の年より15%ほど少ない。1日の売上は、およそ10万円から8.5万円になった。`,source:`売上日報`,tags:[`売上`]},{id:`ev_request`,type:`testimony`,title:`依頼：チラシで客を呼び戻す`,headline:`「チラシを配って、離れたお客さんを呼び戻したい」`,description:`小松さんの依頼。駅前のコンビニに流れた客を、チラシで呼び戻したいと考えている。`,source:`baker`,tags:[`依頼`]},{id:`ev_goal`,type:`testimony`,title:`チラシは手段`,headline:`「売上が去年くらいに戻れば、それでいい」`,description:`チラシにこだわりがあるわけではない。小松さんが本当に取り戻したいのは売上だ。`,source:`baker`,tags:[`依頼`,`目的`]},{id:`ev_rival`,type:`testimony`,title:`店主の見立て`,headline:`「駅前のコンビニに客を取られた」`,description:`春に駅前にコンビニができた。朝のパンを、そちらで買う人が増えたのではないかと小松さんは考えている。ただし、数えたわけではない。`,source:`baker`,tags:[`見立て`],opinion:!0},{id:`ev_changes`,type:`testimony`,title:`春に変えたこと`,headline:`「キャッシュレス決済を入れたくらい」`,description:`春、若いお客さんの声を受けて、レジにキャッシュレス決済の端末を入れた。小松さんが思いつく変化はそれくらい。`,source:`baker`,tags:[`変化`]},{id:`ev_customers`,type:`data`,title:`客数（レジ通過）`,headline:`1日 約200人（前年比 ±0%）`,description:`レジを通った人数は、1日およそ200人。前の年と、ほとんど変わっていない。`,source:`レジの記録`,tags:[`客数`]},{id:`ev_items`,type:`data`,title:`レシートの購入点数`,headline:`1人 2.0点 → 1.7点（4月から）`,description:`1枚のレシートに載るパンの数。4月から、平均2.0点が1.7点に減っている。`,source:`レシートの集計`,tags:[`購入点数`]},{id:`ev_price`,type:`data`,title:`1点の値段`,headline:`平均250円（変わらず）`,description:`パン1点あたりの平均の値段は、前の年と同じ。値上げも値下げもしていない。`,source:`レシートの集計`,tags:[`値段`]},{id:`ev_regulars`,type:`testimony`,title:`常連さんは変わらない`,headline:`「朝の常連さんは、みんな毎日来てます」`,description:`レジに立つ早瀬さんの実感。常連の顔ぶれは変わらず、コンビニに流れた人は思い当たらない。`,source:`clerk`,tags:[`客数`]},{id:`ev_shelf`,type:`testimony`,title:`レジ横の焼きたて棚`,headline:`「春に、レジ横の焼きたて棚をやめたんです」`,description:`決済 gate`,when:{none:[`ev_customers`]},title:`調べる先を選ぶ`,text:[`調べる先ごとに、かかる工数が違う。鍵のかかった調べ先は、推理が進むと開く。`,`客の数が分かる「レジの記録を見る」を選ぼう。`],focus:`lead:doc_register`},{id:`c_board`,at:`hub`,when:{any:[`ev_customers`,`ev_regulars`],none:[`in_spend`]},title:`仮説を検証する`,text:[`客の数が分かった。推理ボードで、仮説「コンビニに客を取られた」を検証しよう。`],focus:`board`},{id:`c_connect`,at:`chain`,when:{none:[`in_spend`]},title:`仮説を、事実と照らし合わせる`,text:[`ここが推理ボードのロジックチェーン。いちばん上の「起きたこと」の下に、いまの仮説「コンビニに客を取られた」がある。そのすぐ下が、手がかりと照らし合わせる欄だ。`,`まず、手元の事実がこの仮説を「裏付ける」のか「崩す」のかを選ぶ。裏付けるなら根拠を、崩すなら仮説と食い違う事実を置く。数字でじかに確かめられる事実なら1枚で足り、人の話のように弱いものは、もう1枚重ねる。欄をタップすると、集めた手がかりから選べる。集めた手がかりは「手がかり」のタブで、いつでも読み返せる。`,`客を取られたなら、客の数が減っているはずだ。でも「客数」は去年と変わっていない。仮説と食い違う。「崩す」を選んで、「食い違う事実」に「客数」を置いて「仮説と照らし合わせる」を押そう。客は1日200人のまま。売上10万円から8.5万円を200人で割ると、1人あたり500円が425円 ―― 減ったのは、客ではない。`],focus:`stance,slot:0,card:ev_customers`},{id:`c_hyp`,at:`chain`,when:{all:[`in_spend`],none:[`in_items`]},title:`鎖がひとつ伸びた`,text:[`客の数は減っていない。コンビニ説は崩れて、鎖が切れた（✗）。でも、分かったこと「減ったのは1人あたりの金額」が仮説の中に入り、その下に次の「なぜ？」が開いた。`,`✓ は鎖がつながった仮説、？ はまだ確かめていない仮説だ。1人あたりの金額が減ったのはなぜ？ ――「1人が買う数が減った」をタップして、いまの仮説にしよう。仮説が増えてきたら、「なぜ？」の札をタップすると、その先をたためる。`],focus:`node:hy_items`},{id:`c_mark`,at:`hub`,when:{all:[`in_spend`],none:[`ev_items`,`in_items`]},title:`◆ の印を追う`,text:[`この仮説を確かめる材料は、まだ手元にない。◆ の付いた「調べる」に、材料がありそうだ。`,`推理が進んで「レシートを分析する」が開いた。2人日かかる。`],focus:`investigate`},{id:`c_investigate2`,at:`investigate`,when:{all:[`in_spend`],none:[`ev_items`,`ev_obs_register`,`in_items`]},title:`レシートを分析する`,text:[`「レシートを分析する」を選ぼう。1人が買う数が分かるはずだ。`],focus:`lead:ana_receipt`},{id:`c_board2`,at:`hub`,when:{all:[`ev_items`],none:[`in_items`]},title:`材料がそろった`,text:[`仮説を確かめる材料は、もう手元にある。次の工数を使う前に、推理ボードで検証しよう。`,`調べに行く前に「手元のカードで確かめられないか」を考えるのが、工数を節約するコツだ。`],focus:`board`},{id:`c_connect2`,at:`chain`,when:{all:[`ev_items`],none:[`in_items`]},title:`もう一度、検証する`,text:[`今度の仮説は「1人が買う数が減った」。レシートの数字は、この仮説をじかに裏付けている。「裏付ける」のまま、「根拠」に「レシートの購入点数」を置いて「仮説と照らし合わせる」を押そう。`,`数字でじかに確かめられる根拠なら、1枚で足りる。人の話のような弱い根拠は、もう1枚重ねて確かめる。もうひとつの数字「1点の値段」は、仮説「高いパンが売れなくなった」を崩す材料になる。`],focus:`slot:0,card:ev_items`},{id:`c_why`,at:`hub`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`次の仮説へ`,text:[`裏付けが取れた。1人が買う数が減っている。新しく出た仮説「春に、売り場で何かが変わった」が、次の仮説になった。`,`この仮説を確かめるには、減り始めた頃の売り場のことを知る必要がある。◆ の付いた人に話を聞こう。`],focus:`talk`},{id:`c_talk`,at:`talk`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`誰に聞く？`,text:[`売り場のことは、毎日レジに立っている早瀬さんがいちばん詳しい。`],focus:`person:clerk`},{id:`c_hearing_shelf`,at:`scene`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`変化の時期から聞く`,text:[`買う数が減り始めたのは4月。その頃に売り場で変わったことを聞いてみよう。`,`面談で聞けるのは3つまで。◆ の付いた質問は、いまの仮説を確かめられる。`]},{id:`c_hearing`,at:`scene`,when:{none:[`in_items`]},title:`面談の持ち時間`,text:[`面談で聞けるのは3つまで。◆ の付いた質問は、いまの仮説を確かめられる。`,`新しい材料を持って来れば、同じ人から聞ける話が増えることもある。`]},{id:`c_root_hint`,at:`chain`,when:{all:[`in_items`],any:[`ev_shelf`,`ev_shelf_owner`],none:[`in_root`]},title:`売り場で変わったこと`,text:[`仮説は「春に、売り場で何かが変わった」。なぜそう言える？ 春に何を変えたかは、数字には残っていない。変えた本人たちの話が、いちばんの根拠になる。ただ、1人の話だけでは弱い。「裏付ける」で、春に売り場で変わったことのカードを2枚重ねて、仮説と照らし合わせよう。早瀬さんの「レジ横の焼きたて棚」と、小松さんの「春に変えたこと」は、同じ春の話だ。`],focus:`slot:0,slot:1,card:ev_shelf,card:ev_shelf_owner,card:ev_changes`},{id:`c_report`,at:`hub`,when:{all:[`in_root`]},title:`報告しよう`,text:[`真相にたどり着いた。いちばん下の「小松さんに報告する」が光っている。`,`報告では、原因と施策を選ぶ。合意したゴールを満たせるかも考えよう。`],focus:`report`},{id:`c_proposal`,at:`proposal`,title:`最終報告書をつくる`,text:[`コンサルタントの仕事は、最後に報告書で伝えるところまでだ。報告書は、スライド6枚の資料にまとめる。欄をタップして、集めたカードを並べていこう。`,`「現状の課題」には、調べて分かった「いま起きていること」を選ぶ（3つまで）。事実と食い違うことを書くと突っ込まれる。「原因の構造」には推察を、起きたことに近いものから根本原因へ順に並べる。ロジックチェーンの ✓ でつながった道筋が手がかりになる。`,`「ご提案」は2つまで。費用が予算に収まるか、「実行スケジュール」で報告（3か月後）までに動き出すかも確かめよう。依頼人は、この順番で読んでいく。`],focus:`report-findings`},{id:`c_kickoff`,at:`kickoff`,title:`提案して終わり、ではない`,text:[`提案が通ったら、次は実行だ。施策を動かす3か月を、月に一度の定例で支える。`,`最初はキックオフ。誰を巻き込むかを決める。巻き込むと支援工数がかかるが、あとで起きる揉めごとを先回りできる。`,`支援工数も、委託費で賄えるのは決まった日数だけ。超えた分は事務所の赤字だ。動かす施策に関わる人を選ぼう。`],focus:`kickoff-people`},{id:`c_month`,at:`execution`,title:`月次定例`,text:[`実行の途中では、思ってもみなかったことが起きる。定例で、どう手を打つかを決める。`,`手間をかける対応ほど支援工数を使うが、施策の立ち上がりや定着が良くなる。放っておく対応は工数を使わない代わりに、効き目が落ちることがある。`],focus:`issue-options`},{id:`c_result`,at:`result`,title:`チュートリアル完了`,text:[`これでひと通り。次の CONSULTANT REVIEW で、自分の調べ方を振り返ってみよう。`,`本番の CASE 01 は、手がかりも関係者もずっと多い。健闘を祈る。`]}],review:{optimalActions:3,routes:[{label:`数字から`,steps:[`doc_register`,`ana_receipt`,`hear_clerk:cl_q_changes`],note:`客数と売上を並べて客単価の低下に気づき、レシートで買う数の減少を確かめ、変化の理由を現場に聞く。`},{label:`現場から`,steps:[`hear_clerk:cl_q_customers,cl_q_changes,cl_q_shelf`,`ana_receipt`],note:`レジに立つ人の実感から、客が減っていないことと春に棚をやめたことを聞き出し、レシートで買う数の減少を確かめる。`}],keyInvestigations:[`doc_register`,`ana_receipt`,`hear_clerk`],detourNotes:{obs_register:`レジ前の観察で、ついで買いが消えた様子は目で確かめられる。ただ、それが春に棚をやめたせいだと分かるのは、話を聞いてからだ。`,hear_baker:`店主の話からも棚のことは出てくる。ただ、店主は売り場の細かい変化を覚えていないことが多い。`},tips:[{when:{none:[`ev_customers`,`ev_regulars`]},text:`売上は「客数 × 1人あたりの金額」に分けられる。まず客数を確かめると、疑う先が半分になる。`},{when:{all:[`ev_goal`]},text:`「チラシで」は手段だった。依頼の言葉の奥にある目的を確かめると、選べる手が広がる。`}],truth:[`客数は前の年と同じ。売上が落ちたのは、1人あたりの金額が下がったから。`,`1点の値段は変わらず、1人が買う数が2.0点から1.7点に減っていた。`,`春、決済の端末を置くためにレジ横の焼きたて棚を片付けた。会計のついでの「もう1個」が、そこで消えた。`],scoring:{clientGoalFact:`ev_goal`,keyEvidence:[`ev_customers`,`ev_regulars`],quantGroups:[[`in_spend`],[`ev_items`],[`ev_price`]],stakeholderFacts:[`ev_shelf`,`ev_shelf_owner`],solutionFit:{sol_rack:50,sol_set:30,sol_flyer:10,sol_sale:0},advice:{early:`客数を先に確かめると`,late:`売り場で変わったことを早めに聞くと`},deadlineNote:`3か月たっても、施策が動き出していなかった。`}}}},{id:`case01`,number:`01`,title:`残業25%増加の謎`,teaser:`問い合わせは増えていない。それなのに、なぜ残業は25%増えた？`,data:{id:`case01`,number:`01`,title:`問い合わせは増えていない。それなのに、なぜ残業は25%増えた？`,shortTitle:`残業25%増加の謎`,subtitle:`ハルモニア電機 お客様相談センター`,question:`問い合わせは増えていない。

所が見える。`},{when:{all:[`in_customer_wait`]},text:`後処理がお客様の待ち時間にまで響いていると気づけたのは大きい。コストだけでなく、顧客への影響も語れる提案になる。`},{when:{all:[`in_not_skill`]},text:`「新人のせい」という見立てを、数字で否定できた。人ではなく仕組みを疑えたことが、真相への近道になった。`}],truth:[`残業代が前年比25%増えた。`,`件数は+3%しか増えていない。伸びたのは1件あたりの処理時間（8.2分→10.1分）だった。`,`伸びた1.9分のうち1.5分は、通話が終わった後の後処理だった。`,`3月に応対記録の必須項目が6→14に増え、42種の分析タグが新設されていた。`,`依頼したのは商品企画部。新商品AERISの顧客分析のためだったが、その入力時間を誰も見積もらなかった。センターの業務量は、センターの外で決まっていた。`],scoring:{clientGoalFact:`in_real_goal`,keyEvidence:[`ev_breakdown`,`ev_obs_acw`],quantGroups:[[`in_gap`],[`in_per_call`],[`ev_breakdown`],[`in_step`,`in_not_skill`,`in_not_system`,`in_not_faq`,`in_callmix`]],stakeholderFacts:[`ev_pp_open`,`ev_pp_usage`],solutionFit:{sol_redesign:50,sol_ai_acw:35,sol_cut_fields:30,sol_faq:10,sol_chatbot:5,sol_staff:0},advice:{early:`処理時間の内訳を早い段階で確認すると`,late:`変更の経緯を知る人や資料に早めに当たると`},aiMismatchNote:`「AIを使う話はどうなったんですか？」――AIを使わない理由を、黒田に説明しきれなかった。`,deadlineNote:`3か月後の経営会議までに、施策が動き出していなかった。`}}}},{id:`case02`,number:`02`,title:`消えた1.8億円の謎`,teaser:`売上は過去最高。それなのに、なぜ会社に金がない？`,data:{id:`case02`,number:`02`,title:`売上は過去最高。それなのに、なぜ会社に金がない？`,shortTitle:`消えた1.8億円の謎`,subtitle:`ミナセ什器株式会社`,question:`売上は過去最高。

`client`},{id:`accounting`,name:`久我 澄江`,nameKana:`くが すみえ`,shortName:`久我部長`,role:`経理部 部長`,affiliation:`ミナセ什器`,stance:`金の出入りを一人で見ている。毎月、銀行と話をつけて支払いをつないできた。`,interests:[`資金繰り`,`銀行との関係`,`月末の締め`],assumptions:[`営業は回収のことを考えていない`],claim:`売っても売っても、入金が遅い。`,color:`#5d6f91`,initials:`久`,portraits:{neutral:`assets/characters/accounting/neutral.png`,serious:`assets/characters/accounting/serious.png`,surprised:`assets/characters/accounting/surprised.png`,concerned:`assets/characters/accounting/concerned.png`},group:`other`},{id:`sales`,name:`蛭田 剛`,nameKana:`ひるた つよし`,shortName:`蛭田部長`,role:`営業部 部長`,affiliation:`ミナセ什器`,stance:`過去最高の売上をつくった立役者。金の心配は自分の仕事ではないと考えている。`,interests:[`売上目標`,`大口の取引先`,`営業部の評価`],assumptions:[`売るのが営業の仕事。金の心配は経理の仕事`,`金がないのは工場が作りすぎているからだ`],claim:`回収は順調。遅れている客はいない。`,color:`#a2483f`,initials:`蛭`,portraits:{neutral:`assets/characters/sales/neutral.png`,serious:`assets/characters/sales/serious.png`,concerned:`assets/characters/sales/concerned.png`,smile:`assets/characters/sales/smile.png`},group:`other`},{id:`factory`,name:`戸叶 茂`,nameKana:`とかの しげる`,shortName:`戸叶工場長`,role:`工場長`,affiliation:`ミナセ什器`,stance:`納期を守ることが誇り。言われた物を、言われた日までに作る。`,interests:[`納期`,`材料の手配`,`現場の段取り`],assumptions:[`在庫は営業の言うとおりに積んでいるだけだ`],claim:`売れ残りなんかない。在庫は内示どおりだ。`,color:`#5f7d55`,initials:`戸`,portraits:{neutral:`assets/characters/factory/neutral.png`,serious:`assets/characters/factory/serious.png`,surprised:`assets/characters/factory/surprised.png`,concerned:`assets/characters/factory/concerned.png`},group:`frontline`},{id:`rep`,name:`瀬川 航`,nameKana:`せがわ わたる`,shortName:`瀬川さん`,role:`営業部（サンリーフ薬局担当・4年目）`,affiliation:`ミナセ什器`,stance:`大口の取引先を任されている若手。おかしいと思うことはあるが、口には出していない。`,interests:[`自分の評価`,`取引先との関係`],assumptions:[`条件は上が決めたことだから、口を出せない`],claim:`150日は長いと思った。でも、評価は売上だけなので。`,color:`#7b6aa5`,initials:`瀬`,portraits:{neutral:`assets/characters/rep/neutral.png`,surprised:`assets/characters/rep/surprised.png`,concerned:`assets/characters/rep/concerned.png`},group:`frontline`}],scenes:[{id:`office`,name:`あなたのオフィス`,background:`assets/backgrounds/office.jpg`,tone:`#1b1e24`},{id:`president_room`,name:`ミナセ什器 応接室`,background:`assets/backgrounds/president_room.jpg`,tone:`#2a2420`},{id:`accounting_office`,name:`経理部`,background:`assets/backgrounds/accounting_office.jpg`,tone:`#1d2330`},{id:`sales_office`,name:`営業部`,background:`assets/backgrounds/sales_office.jpg`,tone:`#2c1f1d`},{id:`factory`,name:`工場`,background:`assets/backgrounds/factory.jpg`,tone:`#1e2a22`},{id:`warehouse`,name:`倉庫`,background:`assets/backgrounds/warehouse.jpg`,tone:`#26241c`},{id:`break_room`,name:`休憩スペース`,background:`assets/backgrounds/break_room.jpg`,tone:`#27231f`}],evidence:[{id:`ev_sales`,type:`data`,title:`売上高`,headline:`24.0億円 → 31.2億円（過去最高）`,description:`前期より30%伸びた。創業以来の最高額。`,source:`決算の概況`,tags:[`売上`]},{id:`ev_cash`,type:`data`,title:`手元の現金・預金`,headline:`2.4億円 → 0.6億円`,description:`1年で1.8億円減った。いまの残高は、ひと月の売上（約2.6億円）の4分の1ほどしかない。`,source:`決算の概況`,tags:[`現金`]},{id:`ev_profit`,type:`data`,title:`営業利益`,headline:`1.1億円 → 1.3億円`,description:`売上から、原価と経費をすべて引いたあとに残る本業の儲け。黒字で、前期より増えている。`,source:`決算の概況`,tags:[`利益`,`経費`]},{id:`ev_pres_request`,type:`testimony`,title:`依頼：経費を10%削りたい`,headline:`「経費を10%削って、資金繰りを立て直したい」`,description:`水瀬社長の依頼。売上が過去最高なのに金がないのは、どこかで無駄に使われているからだと考えている。`,source:`president`,tags:[`依頼`,`経費`]},{id:`ev_pres_goal`,type:`testimony`,title:`乗り切りたいのは3か月後`,headline:`「要は、3か月後の賞与と借り換えを乗り切りたい」`,description:`経費を削ること自体が目的ではない。3か月後に賞与（約9,000万円）の支払いと、銀行の借り換えの審査がある。それまでに手元の金を厚くしたい。できれば、これ以上は借りずに。`,source:`president`,tags:[`依頼`,`目的`]},{id:`ev_budget`,type:`document`,title:`施策の予算と期限`,headline:`上限600万円／3か月後に賞与の支給`,description:`施策に使える金は600万円まで。3か月後の賞与の支給日までに、結果を出したい。`,source:`水瀬社長`,tags:[`予算`,`期限`]},{id:`ev_pres_view`,type:`testimony`,title:`社長の見立て`,headline:`「どこかで金が無駄に使われてるんですよ」`,description:`営業の接待か、工場の残業か。経費の明細までは見ていない。`,source:`president`,tags:[`経費`],opinion:!0},{id:`ev_pres_approved`,type:`testimony`,title:`条件は呑めと言った`,headline:`「取れるなら条件は呑め、と言いましたよ」`,description:`サンリーフ薬局との取引条件は、社長自身が決裁した。金の出入りへの影響は「久我がなんとかするだろう」と考えていた。`,source:`president`,tags:[`条件`,`決裁`]},{id:`ev_pres_sales_first`,type:`testimony`,title:`売上はすべてを癒す`,headline:`「売上さえ伸びれば、金はあとからついてくる」`,description:`先代からの口癖。営業の評価も賞与も、売上高で決めている。`,source:`president`,tags:[`評価`,`売上`]},{id:`ev_pres_no_loan`,type:`testimony`,title:`これ以上は借りたくない`,headline:`「銀行に頭を下げるのは、もうごめんだ」`,description:`この1年で2億円以上を借り足した。頼めば貸してはくれるが、借りるたびに計画と見通しを問いただされる。`,source:`president`,tags:[`借入`]},{id:`ev_acc_late`,type:`testimony`,title:`入金が遅い`,headline:`「売っても売っても、入金が遅いんです」`,description:`売掛金ばかりが積み上がる、というのが久我部長の実感。『遅い』が何を指しているのかは、はっきりしない。`,source:`accounting`,tags:[`売掛金`,`入金`]},{id:`ev_acc_no_dunning`,type:`testimony`,title:`期日は守られている`,headline:`「期日を過ぎた入金は、ほとんどありません」`,description:`督促を出すような延滞は年に数件で、額も小さい。入金を記録している経理から見て、得意先は期日どおりに払っている。`,source:`accounting`,tags:[`売掛金`,`入金`]},{id:`ev_acc_blame`,type:`testimony`,title:`経理部長の見立て（営業）`,headline:`「営業が、無茶な条件でも勝手に呑んでくるからです」`,description:`久我部長は、営業が売上ほしさに独断で条件を決めていると考えている。`,source:`accounting`,tags:[`条件`,`営業`],opinion:!0},{id:`ev_acc_thin`,type:`testimony`,title:`経理部長の見立て（利幅）`,headline:`「サンリーフさんは利幅が薄い。売るほど損してるんじゃないかしら」`,description:`大口の取引先は利幅が薄い。それで金が残らないのでは、と久我部長は疑っている。`,source:`accounting`,tags:[`利益`,`粗利`],opinion:!0},{id:`ev_acc_after`,type:`testimony`,title:`条件を知ったのは契約のあと`,headline:`「150日だと知ったのは、最初の請求書を出すときです」`,description:`サンリーフ薬局との契約は、経理を通らずに決まった。稟議書も経理には回ってこない。経理が条件を知ったのは、取引が始まってからだった。`,source:`accounting`,tags:[`条件`,`経理`]},{id:`ev_acc_monthly`,type:`testimony`,title:`資金繰り表は月に一度`,headline:`「資金繰り表は月に一度。社長が見るのは残高だけです」`,description:`資金繰り表は久我部長が一人で作っている。受注が決まった時点で、いつ・いくら金が要るかを試算する決まりはない。`,source:`accounting`,tags:[`資金繰り`,`経理`]},{id:`ev_acc_pay30`,type:`testimony`,title:`仕入先には30日で払う`,headline:`「仕入先には、月末締めの翌月末払い。昔から変えていません」`,description:`仕入先も中小企業が多く、支払いを延ばしてくれとは言えない。材料の代金は、仕入れからおよそ30日後に出ていく。`,source:`accounting`,tags:[`支払`,`仕入`]},{id:`ev_sales_sunleaf`,type:`testimony`,title:`伸びたのはサンリーフ薬局`,headline:`「伸びた分は、ほとんどサンリーフ薬局ですよ。今期6億5千万」`,description:`去年の春に取引を始めた大手ドラッグストア。年120店の出店に合わせて、陳列棚を一括で納めている。`,source:`sales`,tags:[`売上`,`サンリーフ`]},{id:`ev_sales_ontime`,type:`testimony`,title:`回収は順調`,headline:`「期日どおりに全部入ってます。遅れてる客なんかいない」`,description:`蛭田部長によれば、貸し倒れは一件もない。`,source:`sales`,tags:[`売掛金`,`入金`]},{id:`ev_sales_blame`,type:`testimony`,title:`営業部長の見立て（工場）`,headline:`「金がないのは、工場が作りすぎてるからでしょう」`,description:`倉庫に積まれた棚を見て、蛭田部長は工場の作りすぎを疑っている。`,source:`sales`,tags:[`在庫`,`工場`],opinion:!0},{id:`ev_sales_normal`,type:`testimony`,title:`営業部長の見立て（業界）`,headline:`「この業界、回収が遅いのは当たり前ですよ。どこも同じです」`,description:`大手と付き合うとはそういうことだ、と蛭田部長は言う。ほかの会社の数字を確かめたわけではない。`,source:`sales`,tags:[`売掛金`,`業界`],opinion:!0},{id:`ev_sales_pres_ok`,type:`testimony`,title:`条件は社長が決めた`,headline:`「150日は長いと思いましたよ。でも社長が『呑め』と」`,description:`蛭田部長によれば、サンリーフ薬局の支払条件は社長の判断で受けた。稟議も社長の判で通っているという。`,source:`sales`,tags:[`条件`,`決裁`]},{id:`ev_sales_eval`,type:`testimony`,title:`営業の評価は売上高だけ`,headline:`「評価は売上高。回収まで見ろとは言われてません」`,description:`営業の目標も賞与も、売上高の達成率で決まる。回収までの日数や粗利は、評価に入っていない。`,source:`sales`,tags:[`評価`,`営業`]},{id:`ev_factory_naiji`,type:`testimony`,title:`在庫は内示どおり`,headline:`「内示どおりに積んでるだけだ。開店日は動かせない」`,description:`サンリーフ薬局向けの棚は専用寸法。開店日に間に合わせるため、2か月前には材料を押さえ、作りためておくという。`,source:`factory`,tags:[`在庫`,`内示`]},{id:`ev_factory_noleft`,type:`testimony`,title:`売れ残りはない`,headline:`「売れ残りなんかない。倉庫の物は全部、行き先が決まってる」`,description:`戸叶工場長によれば、倉庫の棚はどれも納品先の店が決まっている。`,source:`factory`,tags:[`在庫`]},{id:`ev_factory_price`,type:`testimony`,title:`工場長の見立て（材料）`,headline:`「鋼材も合板も上がってる。在庫の金額が膨らむのは当たり前だ」`,description:`同じ量でも高くつく、と戸叶工場長は言う。どれだけ上がったかの数字は持っていない。`,source:`factory`,tags:[`在庫`,`材料`],opinion:!0},{id:`ev_factory_change`,type:`testimony`,title:`内示はよく変わる`,headline:`「店の数は、月に2割は動く」`,description:`余った部材は次の店に回すが、寸法の違う物は寝かせるしかない。確定を待てれば、こんなに積まなくて済む。`,source:`factory`,tags:[`在庫`,`内示`]},{id:`ev_rep_eval`,type:`testimony`,title:`言い出せなかった`,headline:`「長いとは思いました。でも、評価は売上だけなので」`,description:`ほかの得意先は60日。おかしいと思っても、売上が立つ話を止める理由が、営業にはない。`,source:`rep`,tags:[`評価`,`条件`]},{id:`ev_rep_naiji`,type:`testimony`,title:`内示は3か月前、確定は1か月前`,headline:`「内示が来たら、そのまま工場に流してます」`,description:`サンリーフ薬局からは3か月前に店数の内示が来て、1か月前に確定する。確定を待つと間に合わないと言われ、内示の時点で手配している。`,source:`rep`,tags:[`在庫`,`内示`]},{id:`ev_rep_hint`,type:`testimony`,title:`早く払ってもらえる制度？`,headline:`「早く払ってもらえる制度があるって、先方が言ってたような……」`,description:`サンリーフ薬局の担当者が口にしていたが、詳しいことは分からない。社内で調べた人もいない。`,source:`rep`,tags:[`サンリーフ`,`条件`]},{id:`ev_bs`,type:`data`,title:`貸借対照表（2期の比較）`,headline:`売掛金 4.0→7.6億円／在庫 2.1→3.9億円`,description:`売上は+30%なのに、売掛金（売ったがまだ受け取っていない代金）は+90%、在庫は+86%。買掛金は2.0→2.6億円。現金が減った額より多くの金が、売掛金と在庫に形を変えている。`,source:`決算書`,tags:[`売掛金`,`在庫`]},{id:`ev_sga`,type:`data`,title:`経費（販売費・一般管理費）`,headline:`4.4億円 → 5.3億円（売上比 18.3% → 17.0%）`,description:`増えたのは運賃と人件費で、売上の伸びよりゆるやか。交際費や出張費は横ばい。`,source:`決算書`,tags:[`経費`]},{id:`ev_cf`,type:`data`,title:`現金の増減の内訳`,headline:`売掛金の増加 −3.6億円／在庫の増加 −1.8億円`,description:`儲け +1.2億円、売掛金の増加 −3.6億円、在庫の増加 −1.8億円、買掛金の増加 +0.6億円、設備 −0.3億円、借入の返済 −0.4億円、新しい借入 +2.5億円。差し引きで −1.8億円。`,source:`資金繰り表`,tags:[`現金`,`売掛金`,`在庫`]},{id:`ev_loan`,type:`data`,title:`借入金の明細`,headline:`返済 年0.4億円（前期と同じ）／新しい借入 +2.5億円`,description:`返済の額は前期と変わらない。足りない分を新しく借りて埋めており、借入金の残高は6.0億円から8.1億円に増えた。`,source:`借入金の明細`,tags:[`借入`]},{id:`ev_contract`,type:`document`,title:`サンリーフ薬局との契約書`,headline:`支払条件：月末締め・150日後払い`,description:`去年4月に結んだ取引基本契約書。ほかの得意先は月末締めの翌々月払い（約60日）。`,source:`取引基本契約書`,tags:[`条件`,`サンリーフ`]},{id:`ev_ringi`,type:`document`,title:`取引開始の稟議書`,headline:`起案：営業部長／決裁：社長／経理の合議欄は空欄`,description:`サンリーフ薬局との取引を始めるときの稟議書。売上の見込みは書いてあるが、必要な資金や入金までの期間を書く欄は、そもそも無い。`,source:`稟議書`,tags:[`条件`,`決裁`]},{id:`ev_purchase_log`,type:`document`,title:`発注の記録`,headline:`サンリーフ向け専用部材を、内示の時点で2か月分発注`,description:`専用寸法の棚板と支柱。確定の注文を待たずに、内示の店数で先に発注している。`,source:`発注台帳`,tags:[`在庫`,`内示`,`仕入`]},{id:`ev_payables`,type:`document`,title:`仕入先への支払条件`,headline:`月末締め・翌月末払い（約30日）`,description:`主な仕入先20社とも、支払条件はここ数年変わっていない。`,source:`支払いの記録`,tags:[`支払`,`仕入`]},{id:`ev_customer_sales`,type:`data`,title:`得意先別の売上`,headline:`増えた7.2億円のうち、6.5億円がサンリーフ薬局`,description:`サンリーフ薬局は去年4月からの新しい取引先。ほかの得意先の合計は 24.0→24.7億円（+3%）で、ほぼ横ばい。`,source:`売上データ分析`,tags:[`売上`,`サンリーフ`]},{id:`ev_margin`,type:`data`,title:`得意先別の粗利`,headline:`粗利率 28.0% → 26.7%（粗利の額は 6.7→8.3億円）`,description:`サンリーフ薬局向けの粗利率は22%で、ほかの得意先（28%）より低い。それでも粗利の額は1.6億円増えている。`,source:`売上データ分析`,tags:[`利益`,`粗利`]},{id:`ev_aging`,type:`data`,title:`売掛金の年齢表`,headline:`期日超過 0.3%／サンリーフ分 3.5億円は「150日後」の約束`,description:`売掛金7.6億円のうち、期日を過ぎているのは0.3%だけ。3.5億円はサンリーフ薬局向けで、どれも期日前。納品の150日後に払う約束のため、5か月分の売上がそのまま売掛金として残っている。ほかの得意先は約60日。`,source:`売掛金データ分析`,tags:[`売掛金`,`入金`,`サンリーフ`]},{id:`ev_stock_detail`,type:`data`,title:`在庫の内訳`,headline:`増えた1.8億円のうち、1.7億円がサンリーフ向け`,description:`サンリーフ薬局向けの専用部材・作りかけ・出荷待ちの棚が1.7億円。確定前の内示で手配した分を含み、どれも納品先の店が決まっている。1年以上動いていない在庫は0.2億円で、前期と変わらない。金額だけでなく、数量で見ても7割増えている。`,source:`在庫データ分析`,tags:[`在庫`,`サンリーフ`]},{id:`ev_obs_warehouse`,type:`observation`,title:`倉庫の棚`,headline:`棚の半分に「サンリーフ ○○店・○月納品」の札`,description:`出来上がった陳列棚が、店ごとにまとめて積んである。開店日に合わせて一括で納めるため、先に出来上がった分はここで待っている。ほこりをかぶった古い在庫は、奥の一角だけ。`,source:`現場観察`,tags:[`在庫`,`サンリーフ`],image:`assets/evidence/warehouse_tags.jpg`},{id:`ev_obs_line`,type:`observation`,title:`工場の作りかけ`,headline:`ラインの脇に、2か月先の店の部材`,description:`まだ店が確定していない分まで、専用寸法の棚板が切り出してある。戸叶工場長いわく「内示が出たら切っておかないと、間に合わない」。`,source:`現場観察`,tags:[`在庫`,`内示`],image:`assets/evidence/factory_parts.jpg`},{id:`ev_ext_news`,type:`document`,title:`業界紙の記事`,headline:`「サンリーフ薬局、取引先への支払いを150日に統一」`,description:`去年3月の流通業界紙の記事。年120店の出店を続けるため、全取引先の支払条件を一律150日にそろえたとある。取引先向けの支援策にも触れているが、中身は書かれていない。`,source:`流通業界紙（Web検索）`,tags:[`条件`,`サンリーフ`,`外部`]},{id:`ev_ext_rumor`,type:`testimony`,title:`匿名掲示板の書き込み`,headline:`「サンリーフは資金繰りがヤバいらしい。支払いを引き延ばしてる」`,description:`書いた人も、根拠も分からない。日付は2年前。`,source:`匿名掲示板（Web検索）`,tags:[`サンリーフ`,`外部`],rumor:!0},{id:`ev_ext_ir_health`,type:`data`,title:`サンリーフ薬局の財務`,headline:`自己資本比率 58%／現預金 420億円`,description:`東証プライム上場。業績は8期連続の増収増益で、支払いの遅れや資金繰りの不安を示す記載はない。150日の支払条件は「出店投資のための全社方針」と説明されている。`,source:`サンリーフ薬局 決算説明資料`,tags:[`サンリーフ`,`外部`]},{id:`ev_ext_program`,type:`document`,title:`早期支払いプログラム`,headline:`「手数料 年2%で、納品の30日後に代金を受け取れる」`,description:`サンリーフ薬局が取引先向けに用意している制度。提携銀行が代金を先に立て替える。150日待たずに済むが、申し込まなければ使われない。ミナセ什器は申し込んでいない。`,source:`サンリーフ薬局 取引先向け案内`,tags:[`サンリーフ`,`条件`,`外部`]},{id:`ev_ext_bench`,type:`data`,title:`同業他社との比較`,headline:`売ってから入金まで：同業 62日／ミナセ什器 89日`,description:`業界団体の統計と、同業3社の公開決算から。入金までの日数は同業平均62日、在庫は33日分。ミナセ什器は89日・46日分。前期（61日・32日分）は同業並みだった。`,source:`業界団体の統計・同業の公開決算`,tags:[`売掛金`,`業界`,`外部`]},{id:`ev_ext_market`,type:`data`,title:`材料の価格指数`,headline:`鋼材・合板 前年比 +4%`,description:`公的な統計の価格指数。値上がりはしているが、小幅にとどまる。`,source:`公的統計（Web検索）`,tags:[`材料`,`外部`]}],investigations:[{id:`briefing`,kind:`hearing`,title:`ブリーフィング`,summary:`依頼人との最初の打ち合わせ`,actionCost:0,characterId:`president`,sceneId:`president_room`,hidden:!0,questionsPerVisit:99,evidenceReward:[`ev_pres_request`],intro:[{speaker:`narration`,text:`ミナセ什器 本社2階、応接室。壁には「売上30億円突破」の祝い花の写真が飾られている。`},{speaker:`president`,text:`水瀬です。わざわざ埼玉まで、ありがとうございます。`,expression:`neutral`},{speaker:`president`,text:`今期は過去最高の売上でした。31億。利益もちゃんと出ている。`,expression:`smile`},{speaker:`president`,text:`……なのに、金がないんですよ。通帳の残高は、1年で2億4千万から6千万に減った。`,expression:`serious`},{speaker:`president`,text:`どこかで金が無駄に使われてるとしか思えない。経費を10%削って、資金繰りを立て直したいんです。`,expression:`concerned`},{speaker:`narration`,text:`――儲かっているのに、金がない。削るべきは、本当に経費なのだろうか。`}],outro:[{speaker:`president`,text:`調査は2週間でお願いします。社内には話を通しておきますから。`,expression:`neutral`},{speaker:`narration`,text:`2週間で動ける回数は、前の仕事より少ない。誰に会い、何を調べるか。`}],topics:[{id:`br_goal`,label:`経費を削って、何を実現したいのですか？`,lines:[{speaker:`president`,text:`何を、って……。`,expression:`surprised`},{speaker:`president`,text:`3か月後に賞与があるんです。9,000万円。それと、銀行の借り換えの審査も同じ頃に。`,expression:`serious`},{speaker:`president`,text:`要は、そこを乗り切れるだけの金を手元に置きたい。銀行にこれ以上頭を下げるのは、ごめんですがね。`,expression:`concerned`}],evidenceReward:[`ev_pres_goal`]},{id:`br_budget`,label:`施策に使える予算と、期限を教えてください。`,lines:[{speaker:`president`,text:`金がないと言ってる会社ですからね。使えるのは600万円まで。`,expression:`serious`},{speaker:`president`,text:`期限は3か月後。賞与の支給日です。`,expression:`neutral`}],evidenceReward:[`ev_budget`]},{id:`br_view`,label:`金がない理由を、どう見ていますか？`,lines:[{speaker:`president`,text:`だから、無駄遣いですよ。売上がこれだけ伸びて金が残らないなんて、おかしいでしょう。`,expression:`serious`},{speaker:`president`,text:`営業の接待か、工場の残業か。明細までは見てませんがね。`,expression:`neutral`}],evidenceReward:[`ev_pres_view`]}]},{id:`hear_president`,kind:`hearing`,title:`水瀬社長に話を聞く`,summary:`依頼人。会社の方針と、大きな取引を最後に決める人`,actionCost:1,characterId:`president`,sceneId:`president_room`,tests:[`hy_sales_solo`,`hy_nobody`],intro:[{speaker:`narration`,text:`応接室。水瀬は受注の速報を眺めていた。`},{speaker:`president`,text:`どうです、無駄は見つかりましたか？`,expression:`neutral`}],revisitIntro:[{speaker:`president`,text:`また何か？ 来客があるので、手短に。`,expression:`neutral`}],topics:[{id:`pr_q_terms`,label:`サンリーフ薬局の「150日後払い」は、どなたが決めたのですか？`,requires:{any:[`ev_contract`,`ev_ringi`,`ev_sales_pres_ok`,`ev_aging`,`ev_acc_after`,`ev_ext_news`]},lines:[{speaker:`president`,text:`サンリーフ？ あれはうちの宝ですよ。年6億の客だ。`,expression:`smile`},{speaker:`president`,text:`150日ね。蛭田が渋ってたんで、私が言ったんです。取れるなら条件は呑め、と。`,expression:`neutral`},{speaker:`player`,text:`入金まで5か月、そのあいだの金はどうするおつもりでしたか。`},{speaker:`president`,text:`金のこと？ それは久我がなんとかするでしょう。経理なんだから。`,expression:`serious`}],evidenceReward:[`ev_pres_approved`]},{id:`pr_q_eval`,label:`営業の評価は、何で決めていますか？`,lines:[{speaker:`president`,text:`売上ですよ。決まってるじゃないですか。`,expression:`surprised`},{speaker:`president`,text:`先代の口癖でね。『売上はすべてを癒す』。売上さえ伸びれば、金はあとからついてくる。`,expression:`smile`}],evidenceReward:[`ev_pres_sales_first`]},{id:`pr_q_loan`,label:`銀行から追加で借りる、という手はありますか？`,lines:[{speaker:`president`,text:`頼めば貸してはくれるでしょう。この1年で2億以上、もう借り足してる。`,expression:`concerned`},{speaker:`president`,text:`でも、もうごめんです。借りるたびに『計画は』『見通しは』と根掘り葉掘りだ。`,expression:`serious`}],evidenceReward:[`ev_pres_no_loan`]},{id:`pr_q_goal`,label:`経費を削って、何を実現したいのですか？`,requires:{none:[`ev_pres_goal`]},lines:[{speaker:`president`,text:`3か月後に賞与があるんです。9,000万円。銀行の借り換えの審査も同じ頃に。`,expression:`serious`},{speaker:`president`,text:`要は、そこを乗り切れるだけの金を手元に置きたい。銀行にこれ以上頭を下げるのは、ごめんですがね。`,expression:`concerned`}],evidenceReward:[`ev_pres_goal`]}]},{id:`hear_accounting`,kind:`hearing`,title:`久我部長に話を聞く`,summary:`経理部長。金の出入りを一人で見ている`,actionCost:1,characterId:`accoun け取れない金が積み上がっていく。`,flash:`遅れているんじゃない。最初から、150日後という約束なんだ。`,after:[`in_wc`],requiredEvidence:[`ev_aging`],alternatives:[[`ev_contract`,`ev_customer_sales`],[`ev_contract`,`ev_sales_sunleaf`],[`ev_ext_news`,`ev_customer_sales`],[`ev_ext_news`,`ev_sales_sunleaf`],[`ev_acc_after`,`ev_customer_sales`],[`ev_acc_after`,`ev_sales_sunleaf`],[`ev_sales_pres_ok`,`ev_customer_sales`]],supporting:[`ev_acc_late`],level:3,important:!0},{id:`in_prebuild`,title:`サンリーフ向けは、内示の時点で材料を仕入れている`,description:`サンリーフ薬局向けの棚は専用寸法で、開店日は動かせない。間に合わせるために、内示の時点で材料を仕入れ、作りためて出荷を待っている。その材料の代金は、30日後には出ていく。`,flash:`在庫は売れ残りじゃない。まだ確定していない注文のために、先に金を使っているんだ。`,after:[`in_wc`],requiredEvidence:[`ev_stock_detail`],alternatives:[[`ev_purchase_log`],[`ev_obs_line`],[`ev_obs_warehouse`,`ev_factory_naiji`],[`ev_obs_warehouse`,`ev_rep_naiji`],[`ev_factory_naiji`,`ev_rep_naiji`],[`ev_obs_warehouse`,`ev_factory_change`],[`ev_factory_change`,`ev_rep_naiji`]],level:4,important:!0},{id:`in_root`,title:`売上しか見ない仕組みが、売るほど金が減る取引を通した`,description:`代金が入るのは150日後。材料は内示の時点で仕入れ、30日後に払う。サンリーフ薬局との取引は、売れば売るほど金が先に出ていく形になっていた。それでも止まらなかったのは、営業も社長も売上で判断し、経理が条件を知るのは契約のあとだったからだ。これは経費の問題ではない。取引を決めるときに金の流れを見る仕組みがない、という問題だ。`,flash:`経費の問題じゃない。「売上」しか見ない仕組みの問題だ。`,requiredEvidence:[],fromInsights:[[`in_terms`,`in_prebuild`,`in_nobody`]],level:5,important:!0,rootCause:!0},{id:`in_not_debt`,title:`返済のせいではない`,description:`借入の返済は前期と同じ額。借入金はむしろ増えている。借金は金が減った原因ではなく、足りない分を埋めた結果だ。`,requiredEvidence:[`ev_loan`],alternatives:[[`ev_cf`]]},{id:`in_not_discount`,title:`利幅は薄いが、儲けの額は増えている`,description:`大口の取引は利幅が薄い。それでも儲けの額は前期より増えている。安売りで損をして金が減った、とは言えない。`,requiredEvidence:[`ev_margin`],alternatives:[[`ev_profit`]]},{id:`in_not_overdue`,title:`遅れているのではない`,description:`期日を過ぎた入金は、ほとんどない。得意先は約束どおりに払っている。それでも売掛金が膨らんでいるのなら、約束そのものが遠いのだ。`,requiredEvidence:[`ev_aging`],alternatives:[[`ev_acc_no_dunning`]],supporting:[`ev_sales_ontime`]},{id:`in_not_industry`,title:`業界の慣行ではない`,description:`同業の会社は、売ってからおよそ60日で代金を受け取っている。ミナセ什器も前期までは同業並みだった。長いのは業界ではなく、この1年に増えた取引だ。`,requiredEvidence:[`ev_ext_bench`],supporting:[`ev_bs`,`ev_aging`,`ev_contract`]},{id:`in_not_weak`,title:`払えないのではない。相手の方針だ`,description:`サンリーフ薬局の財務は健全で、金に困っている様子はない。150日は、出店のために全取引先へ一律に求めている条件だ。待っていれば短くなるものではない。`,requiredEvidence:[`ev_ext_ir_health`],supporting:[`ev_ext_news`,`ev_sales_ontime`,`ev_acc_no_dunning`]},{id:`in_not_solo`,title:`営業の独断ではない`,description:`サンリーフ薬局との条件は、営業部長が起案し、社長が決裁していた。誰か一人が勝手に決めたことではない。`,requiredEvidence:[`ev_ringi`],alternatives:[[`ev_pres_approved`]],supporting:[`ev_sales_pres_ok`]},{id:`in_nobody`,title:`営業も社長も売上で決め、経理が知るのは契約のあと`,description:`営業は売上高で評価され、社長は売上を見て決裁し、経理が条件を知るのは契約のあと。稟議書には、必要な資金を書く欄すらない。取引を始める前に、いつ・いくら金が要るかを確かめる人は、どこにもいなかった。`,requiredEvidence:[`ev_ringi`,`ev_acc_after`],alternatives:[[`ev_ringi`,`ev_sales_eval`],[`ev_ringi`,`ev_rep_eval`],[`ev_ringi`,`ev_pres_approved`],[`ev_ringi`,`ev_acc_monthly`],[`ev_ringi`,`ev_pres_sales_first`],[`ev_acc_after`,`ev_sales_eval`],[`ev_acc_after`,`ev_rep_eval`],[`ev_acc_after`,`ev_pres_approved`],[`ev_acc_after`,`ev_pres_sales_first`],[`ev_acc_monthly`,`ev_sales_eval`],[`ev_acc_monthly`,`ev_rep_eval`],[`ev_acc_monthly`,`ev_pres_approved`],[`ev_acc_monthly`,`ev_pres_sales_first`],[`ev_sales_eval`,`ev_pres_approved`],[`ev_sales_eval`,`ev_pres_sales_first`],[`ev_rep_eval`,`ev_pres_approved`],[`ev_rep_eval`,`ev_pres_sales_first`]]},{id:`in_gap`,title:`入るのは150日後、出ていくのは30日後`,description:`材料の代金は30日後に払い、売った代金は150日後に入る。そのあいだの金は、ミナセ什器が立て替えている。サンリーフ薬局向けの売上が伸びるほど、立て替える額も増えていく。`,flash:`売れば売るほど、金が先に出ていく。`,after:[`in_terms`],requiredEvidence:[`ev_contract`,`ev_payables`],alternatives:[[`ev_contract`,`ev_acc_pay30`],[`ev_aging`,`ev_payables`],[`ev_aging`,`ev_acc_pay30`],[`ev_ext_news`,`ev_payables`],[`ev_ext_news`,`ev_acc_pay30`],[`ev_acc_after`,`ev_payables`],[`ev_acc_after`,`ev_acc_pay30`],[`ev_sales_pres_ok`,`ev_payables`],[`ev_sales_pres_ok`,`ev_acc_pay30`]],important:!0},{id:`in_not_dead`,title:`売れ残りではない`,description:`長く動いていない在庫は、前期から増えていない。増えた在庫は、どれも納品先が決まっている。作りすぎて余っているのではない。`,requiredEvidence:[`ev_stock_
