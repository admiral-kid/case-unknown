racters/clerk/neutral.png`,smile:`assets/characters/clerk/smile.png`,surprised:`assets/characters/clerk/surprised.png`,concerned:`assets/characters/clerk/concerned.png`},group:`frontline`}],scenes:[{id:`bakery`,name:`こむぎ堂 売り場`,background:`assets/backgrounds/bakery.jpg`,tone:`#2a2118`},{id:`bakery_kitchen`,name:`こむぎ堂 厨房`,background:`assets/backgrounds/bakery_kitchen.jpg`,tone:`#231d18`}],evidence:[{id:`ev_sales`,type:`data`,title:`売上`,headline:`前年比 −15%`,description:`4月から毎月、前の年より15%ほど少ない。1日の売上は、およそ10万円から8.5万円になった。`,source:`売上日報`,tags:[`売上`]},{id:`ev_request`,type:`testimony`,title:`依頼：チラシで客を呼び戻す`,headline:`「チラシを配って、離れたお客さんを呼び戻したい」`,description:`小松さんの依頼。駅前のコンビニに流れた客を、チラシで呼び戻したいと考えている。`,source:`baker`,tags:[`依頼`]},{id:`ev_goal`,type:`testimony`,title:`チラシは手段`,headline:`「売上が去年くらいに戻れば、それでいい」`,description:`チラシにこだわりがあるわけではない。小松さんが本当に取り戻したいのは売上だ。`,source:`baker`,tags:[`依頼`,`目的`]},{id:`ev_rival`,type:`testimony`,title:`店主の見立て`,headline:`「駅前のコンビニに客を取られた」`,description:`春に駅前にコンビニができた。朝のパンを、そちらで買う人が増えたのではないかと小松さんは考えている。ただし、数えたわけではない。`,source:`baker`,tags:[`見立て`]},{id:`ev_changes`,type:`testimony`,title:`春に変えたこと`,headline:`「キャッシュレス決済を入れたくらい」`,description:`春、若いお客さんの声を受けて、レジにキャッシュレス決済の端末を入れた。小松さんが思いつく変化はそれくらい。`,source:`baker`,tags:[`変化`]},{id:`ev_customers`,type:`data`,title:`客数（レジ通過）`,headline:`1日 約200人（前年比 ±0%）`,description:`レジを通った人数は、1日およそ200人。前の年と、ほとんど変わっていない。`,source:`レジの記録`,tags:[`客数`]},{id:`ev_items`,type:`data`,title:`1人が買う数`,headline:`2.0点 → 1.7点`,description:`1枚のレシートに載るパンの数。4月から、平均2.0点が1.7点に減っている。`,source:`レシートの集計`,tags:[`購入点数`]},{id:`ev_price`,type:`data`,title:`1点の値段`,headline:`平均250円（変わらず）`,description:`パン1点あたりの平均の値段は、前の年と同じ。値上げも値下げもしていない。高いパンが売れなくなったわけでもない。`,source:`レシートの集計`,tags:[`値段`]},{id:`ev_regulars`,type:`testimony`,title:`常連さんは変わらない`,headline:`「朝の常連さんは、みんな毎日来てます」`,description:`レジに立つ早瀬さんの実感。常連の顔ぶれは変わらず、コンビニに流れた人は思い当たらない。`,source:`clerk`,tags:[`客数`]},{id:`ev_shelf`,type:`testimony`,title:`レジ横の焼きたて棚`,headline:`「春に、レジ横の焼きたて棚をやめたんです」`,description:`決済の端末を置く場所がなく、ラスクや 事だったんだな」――小松さんは、少し照れくさそうに笑った。`]},{id:`end_sale`,title:`安売りの代償`,rank:`D`,when:{solutionsAll:[`sol_sale`]},narrative:[`全品10%引きのセールに、店は一時にぎわった。`,`だが、1人が買う数は戻らなかった。値引きの分だけ、売上はさらに削られた。`,`3か月後、1日の売上は {kpi.sales}。`],epilogue:[`セールをやめると、客足も元に戻った。`,`小松さんは、黙ってレジの記録を閉じた。`]},{id:`end_set`,title:`値引きで、もう1個`,rank:`B`,when:{solutionsAll:[`sol_set`]},narrative:[`「2個目は30円引き」の札を、店のあちこちに貼った。`,`もう1個を手に取る客は、少し増えた。3か月後の売上は {kpi.sales}。`,`ただ、値引きの分だけ、去年の水準には届かない。`],epilogue:[`値引きをやめれば、また「もう1個」は消えるだろう。`,`本当の原因は、売り場のどこかに残ったままだ。`]},{id:`end_flyer`,title:`チラシの効き目`,rank:`C`,when:{solutionsAll:[`sol_flyer`]},narrative:[`駅前でチラシを配った。新しい客が、ぽつぽつと来るようになった。`,`だが、1人が買う数は減ったまま。3か月後の売上は {kpi.sales}。`],epilogue:[`チラシの効き目は、半年ほどで薄れた。`,`もともと、客は減っていなかったのだ。`]},{id:`end_default`,title:`小さな一歩`,rank:`C`,when:{},narrative:[`3か月後、1日の売上は {kpi.sales}。`],epilogue:[`店は、いつも通りに朝を迎えている。`]}],hints:[{when:{none:[`in_spend`]},text:`売上は「客数 × 1人あたりの金額」。どちらが落ちたのか、数字を並べてみよう。`},{when:{none:[`in_items`]},text:`1人あたりの金額が落ちたなら、値段が下がったのか、買う数が減ったのか。`},{when:{none:[`ev_shelf`,`ev_shelf_owner`]},text:`買う数が減り始めたのは、いつから？ その頃、売り場で何か変わらなかったか。`},{when:{none:[`in_shelf_gone`]},text:`推理ボードで、仮説「春に、売り場で何かが変わった」を、春に売り場で変わったことのカードと「1人が買う数」で検証してみよう。`},{when:{none:[`in_root`]},text:`ロジックチェーンで、まだ確かめていない仮説を確かめよう。前提の推察がそろうと、根本原因がつながる。`},{when:{},text:`真相にたどり着いた。デスクの「小松さんに報告する」から報告しよう。`}],coach:[{id:`c_briefing`,at:`briefing`,title:`まずは依頼人の話を聞く`,text:[`依頼人の小松さんとの、最初の打ち合わせだ。質問を選ぶと話が聞ける。`,`ブリーフィングでは、いくつ聞いてもいい。全部聞いておこう。`]},{id:`c_goal`,at:`goal`,title:`ゴールを確かめる`,text:[`調査に入る前に、依頼人と「何を目指すか」を確かめておく。ゴールは、最後の報告で達成できたかを見られる。`,`依頼の言葉を、そのままゴールにしていいとは限らない。「チラシで何を実現したいか」を聞けていれば、別の言い方ができるはずだ。`]},{id:`c_hub`,at:`hub`,title:`推理は、仮説から始まる`,text:[`ここがデスク。調査のあいだ、次に何をするかはここで決める。`,`店主の見立て「近くのコンビニに客を取られた」を、いまの仮説として置いておいた。「ゴール」の下の「仮説」が、いまの仮説だ。調査は、この仮説が本当かを確かめるところから始まる。`,`「現場で調べる」（話を聞く・調べる）は工数を使う。委託費で賄えるのは5人日分。調査期間の7人日までは使えるが、超えた分は事務所の赤字になる。「推理ボード」は工数がかからない。`,`客を取られたなら、客の数が減っているはずだ。「調べる」を開こう。◆ の印は、いまの仮説を確かめられる調べ先だ。`],focus:`investigate`},{id:`c_investigate`,at:`investigate`,when:{none:[`ev_customers`]},title:`調べる先を選ぶ`,text:[`調べる先ごとに、かかる工数が違う。鍵のかかった調べ先は、推理が進むと開く。`,`客の数が分かる「レジの記録を見る」を選ぼう。`],focus:`lead:doc_register`},{id:`c_board`,at:`hub`,when:{any:[`ev_customers`,`ev_regulars`],none:[`in_spend`]},title:`仮説を検証する`,text:[`客の数が分かった。推理ボードで、仮説「コンビニに客を取られた」を検証しよう。`],focus:`board`},{id:`c_connect`,at:`board`,when:{none:[`in_spend`]},title:`仮説を、事実と照らし合わせる`,text:[`推理ボードには「ロジックチェーン」と「手がかり」のタブがある。いまは「手がかり」。集めたカードが「事実」（数字・資料・現場）と「証言」（人の話）に分かれて並ぶ。`,`画面の下に「いまの仮説」がある。まず、手元の事実がこの仮説を「裏付ける」のか「崩す」のかを選ぶ。裏付けるなら、仮説の理由になるカードと、その根拠になる「起きていること」のカードを置く。崩すなら、仮説と食い違う事実のカードと、起きていることのカードを置く。人の話だけでは言い切れないので、事実のカードを1枚は入れる。`,`仮説は「コンビニに客を取られた」。客を取られたなら、客の数が減っているはずだ。でも「客数」は去年と変わっていない。仮説と食い違う。「崩す」を選んで、「食い違う事実」に「客数」、「根拠」に起きていること＝「売上」を置いて「仮説と照らし合わせる」を押そう。`],focus:`stance,card:ev_sales,card:ev_customers`},{id:`c_after_insight`,at:`board`,when:{all:[`in_spend`],none:[`ev_items`,`in_items`]},title:`鎖がひとつ伸びた`,text:[`客の数は減っていない。コンビニ説は崩れた。分かったこと「減ったのは1人あたりの金額」は、ロジックチェーンに入った。`,`崩れた仮説の下に、次の「なぜ？」が開いている。「ロジックチェーン」のタブを開いてみよう。`],focus:`tab:chain`},{id:`c_hyp`,at:`chain`,when:{all:[`in_spend`],none:[`in_items`]},title:`次の「なぜ？」を選ぶ`,text:[`ここが、ロジックチェーン。いちばん上の「起きたこと」から、仮説が「なぜ？」で鎖のようにつながっていく。✓ は鎖がつながった仮説、✗ は鎖が切れた（崩れた）仮説、？ はまだ確かめていない仮説だ。`,`1人あたりの金額が減ったのはなぜ？ ―― 「1人が買う数が減った」をタップして、いまの仮説にしよう。確かめて裏付けが取れると ✓ になって鎖がつながり、その下の「なぜ？」が開く。`],focus:`node:hy_items`},{id:`c_mark`,at:`hub`,when:{all:[`in_spend`],none:[`ev_items`,`in_items`]},title:`◆ の印を追う`,text:[`この仮説を確かめる材料は、まだ手元にない。◆ の付いた「調べる」に、材料がありそうだ。`,`推理が進んで「レシートを分析する」が開いた。2人日かかる。`],focus:`investigate`},{id:`c_investigate2`,at:`investigate`,when:{all:[`in_spend`],none:[`ev_items`,`ev_obs_register`,`in_items`]},title:`レシートを分析する`,text:[`「レシートを分析する」を選ぼう。1人が買う数が分かるはずだ。`],focus:`lead:ana_receipt`},{id:`c_board2`,at:`hub`,when:{any:[`ev_items`,`ev_obs_register`],none:[`in_items`]},title:`材料がそろった`,text:[`仮説を確かめる材料は、もう手元にある。次の工数を使う前に、推理ボードで検証しよう。`,`調べに行く前に「手元のカードで確かめられないか」を考えるのが、工数を節約するコツだ。`],focus:`board`},{id:`c_connect2`,at:`board`,when:{any:[`ev_items`,`e
