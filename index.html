rk`,tags:[`変化`,`売り場`]},{id:`ev_shelf_sales`,type:`testimony`,title:`棚のパンはよく売れていた`,headline:`「お会計を待つ間に、1個足してくれた」`,description:`会計を待つ間に「これも」と1個足していく客が多かった。最近は、その光景を見なくなった。`,source:`clerk`,tags:[`売り場`,`購入点数`]},{id:`ev_shelf_owner`,type:`testimony`,title:`昔のレジ横`,headline:`「レジの横に、小さな焼きたて棚を置いてた」`,description:`創業のころから、レジの横には焼きたての小さな棚があった。小松さんは、春にそれを片付けたことを思い出した。`,source:`baker`,tags:[`変化`,`売り場`]},{id:`ev_obs_register`,type:`observation`,title:`レジ前の様子`,headline:`会計は10秒。何も見ずに出ていく`,description:`トレーを置き、端末にスマートフォンをかざす。会計は10秒ほどで終わり、客はそのまま出口へ向かう。レジの周りには、手に取れるものが何もない。`,source:`売り場の観察`,tags:[`売り場`]}],investigations:[{id:`briefing`,kind:`hearing`,title:`ブリーフィング`,summary:`依頼人との最初の打ち合わせ`,actionCost:0,characterId:`baker`,sceneId:`bakery_kitchen`,hidden:!0,questionsPerVisit:99,evidenceReward:[`ev_request`],intro:[{speaker:`narration`,text:`こむぎ堂の奥の厨房。オーブンの熱が、まだ残っている。`},{speaker:`baker`,text:`わざわざすみません。店主の小松です。`,expression:`neutral`},{speaker:`baker`,text:`この春から、売上がずっと前の年を下回ってましてね。毎月15%くらい。`,expression:`concerned`},{speaker:`baker`,text:`駅前にコンビニができたでしょう。あそこに客を取られたんだと思うんです。`,expression:`concerned`},{speaker:`baker`,text:`それで、チラシを配ろうかと。どんなチラシがいいか、相談に乗ってもらえませんか。`,expression:`smile`},{speaker:`narration`,text:`――依頼ははっきりしている。だが、それが本当に解くべき問題だろうか。`}],outro:[{speaker:`baker`,text:`店のことは、何でも早瀬に聞いてください。レジの記録も、奥のパソコンで見られます。`,expression:`neutral`},{speaker:`narration`,text:`動けるのは7回。何から確かめるか。`}],topics:[{id:`br_goal`,label:`チラシで、何を実現したいですか？`,lines:[{speaker:`baker`,text:`何を、って……そりゃ、売上ですよ。`,expression:`surprised`},{speaker:`baker`,text:`チラシにこだわりがあるわけじゃない。売上が去年くらいに戻れば、それでいいんです。`,expression:`neutral`}],evidenceReward:[`ev_goal`]},{id:`br_view`,label:`売上が落ちた原因を、どう見ていますか？`,lines:[{speaker:`baker`,text:`コンビニですよ。朝のパンを、あっちで買う人が増えたんじゃないかな。`,expression:`concerned`},{speaker:`baker`,text:`まあ、数えたわけじゃないんですけどね。`,expression:`neutral`}],evidenceReward:[`ev_rival`]},{id:`br_changes`,label:`春に、お店で変えたことはありますか？`,lines:[{speaker:`baker`,text:`変えたこと？ うーん……キャッシュレスの決済を入れたくらいかな。`,expression:`neutral`},{speaker:`baker`,text:`若 が季節ごとに入れ替えるようになった。`,`「あの棚、そんなに大事だったんだな」――小松さんは、少し照れくさそうに笑った。`]},{id:`end_sale`,title:`安売りの代償`,rank:`D`,when:{solutionsAll:[`sol_sale`]},narrative:[`全品10%引きのセールに、店は一時にぎわった。`,`だが、1人が買う数は戻らなかった。値引きの分だけ、売上はさらに削られた。`,`3か月後、1日の売上は {kpi.sales}。`],epilogue:[`セールをやめると、客足も元に戻った。`,`小松さんは、黙ってレジの記録を閉じた。`]},{id:`end_set`,title:`値引きで、もう1個`,rank:`B`,when:{solutionsAll:[`sol_set`]},narrative:[`「2個目は30円引き」の札を、店のあちこちに貼った。`,`もう1個を手に取る客は、少し増えた。3か月後の売上は {kpi.sales}。`,`ただ、値引きの分だけ、去年の水準には届かない。`],epilogue:[`値引きをやめれば、また「もう1個」は消えるだろう。`,`本当の原因は、売り場のどこかに残ったままだ。`]},{id:`end_flyer`,title:`チラシの効き目`,rank:`C`,when:{solutionsAll:[`sol_flyer`]},narrative:[`駅前でチラシを配った。新しい客が、ぽつぽつと来るようになった。`,`だが、1人が買う数は減ったまま。3か月後の売上は {kpi.sales}。`],epilogue:[`チラシの効き目は、半年ほどで薄れた。`,`もともと、客は減っていなかったのだ。`]},{id:`end_default`,title:`小さな一歩`,rank:`C`,when:{},narrative:[`3か月後、1日の売上は {kpi.sales}。`],epilogue:[`店は、いつも通りに朝を迎えている。`]}],hints:[{when:{none:[`in_spend`]},text:`売上は「客数 × 1人あたりの金額」。どちらが落ちたのか、数字を並べてみよう。`},{when:{none:[`in_items`]},text:`1人あたりの金額が落ちたなら、値段が下がったのか、買う数が減ったのか。`},{when:{none:[`ev_shelf`,`ev_shelf_owner`]},text:`買う数が減り始めたのは、いつから？ その頃、売り場で何か変わらなかったか。`},{when:{none:[`in_root`]},text:`推理ボードで、仮説「春に、売り場で何かが変わった」を、「ついで買いが消えた」と春に売り場で変わったことのカードで検証してみよう。`},{when:{},text:`真相にたどり着いた。デスクの「小松さんに報告する」から報告しよう。`}],coach:[{id:`c_briefing`,at:`briefing`,title:`まずは依頼人の話を聞く`,text:[`依頼人の小松さんとの、最初の打ち合わせだ。質問を選ぶと話が聞ける。`,`ブリーフィングでは、いくつ聞いてもいい。全部聞いておこう。`]},{id:`c_goal`,at:`goal`,title:`ゴールを確かめる`,text:[`調査に入る前に、依頼人と「何を目指すか」を確かめておく。ゴールは、最後の報告で達成できたかを見られる。`,`依頼の言葉を、そのままゴールにしていいとは限らない。「チラシで何を実現したいか」を聞けていれば、別の言い方ができるはずだ。`]},{id:`c_hub`,at:`hub`,title:`推理は、仮説から始まる`,text:[`ここがデスク。調査のあいだ、次に何をするかはここで決める。`,`店主の見立て「近くのコンビニに客を取られた」を、いまの仮説として置いておいた。GOAL の下の「HYPOTHESIS」が、いまの仮説だ。調査は、この仮説が本当かを確かめるところから始まる。`,`「現場で調べる」（話を聞く・調べる）は ACTION を使う。動けるのは7回だけだ。「推理ボード」は ACTION を使わない。`,`客を取られたなら、客の数が減っているはずだ。「調べる」を開こう。◆ の印は、いまの仮説を確かめられる調べ先だ。`],focus:`investigate`},{id:`c_investigate`,at:`investigate`,when:{none:[`ev_customers`]},title:`調べる先を選ぶ`,text:[`調べる先ごとに、使う ACTION の数が違う。鍵のかかった調べ先は、推理が進むと開く。`,`客の数が分かる「レジの記録を見る」を選ぼう。`],focus:`lead:doc_register`},{id:`c_board`,at:`hub`,when:{any:[`ev_customers`,`ev_regulars`],none:[`in_spend`]},title:`仮説を検証する`,text:[`客の数が分かった。推理ボードで、仮説「コンビニに客を取られた」を検証しよう。`],focus:`board`},{id:`c_connect`,at:`board`,when:{none:[`in_spend`]},title:`根拠をセットして、検証する`,text:[`画面の下に「いまの仮説」がある。カードをタップすると、その根拠としてセットされる。長押し（パソコンなら右クリック）で、カードを詳しく読める。`,`「売上」と「客数」をセットして「検証する」を押そう。仮説を裏付ける事実なのか、崩す事実なのかが分かる。`],focus:`card:ev_sales,card:ev_customers`},{id:`c_after_insight`,at:`board`,when:{all:[`in_spend`],none:[`ev_items`,`in_items`]},title:`仮説が崩れた`,text:[`客の数は減っていない。コンビニ説は崩れた。代わりに「減ったのは1人あたりの金額」という解釈が生まれ、上の原因の連鎖が一段深くなった。`,`崩れた仮説の代わりに、新しい仮説が2つ出てきた。「変える」から次の仮説を選ぼう。`],focus:`hypothesis`},{id:`c_hyp`,at:`hypothesis`,title:`次の仮説を選ぶ`,text:[`「1人が買う数が減った」を選んでみよう。`,`仮説ごとに「手元のカードで検証できる」「調べれば確かめられそう」が出ている。印を頼りに、次に何をするかを決めよう。`]},{id:`c_mark`,at:`hub`,when:{all:[`in_spend`],none:[`ev_items`,`in_items`]},title:`◆ の印を追う`,text:[`この仮説を確かめる材料は、まだ手元にない。◆ の付いた「調べる」に、材料がありそうだ。`,`推理が進んで「レシートを分析する」が開いた。ACTION を2使う。`],focus:`investigate`},{id:`c_investigate2`,at:`investigate`,when:{all:[`in_spend`],none:[`ev_items`,`ev_obs_register`,`in_items`]},title:`レシートを分析する`,text:[`「レシートを分析する」を選ぼう。1人が買う数が分かるはずだ。`],focus:`lead:ana_receipt`},{id:`c_board2`,at:`hub`,when:{any:[`ev_items`,`ev_obs_register`],none:[`in_items`]},title:`材料がそろった`,text:[`仮説を確かめる材料は、もう手元にある。次の ACTION を使う前に、推理ボードで検証しよう。`,`調べに行く前に「手元のカードで確かめられないか」を考えるのが、ACTION を節約するコツだ。`],focus:`board`},{id:`c_connect2`,at:`board`,when:{any:[`ev_items`,`ev_obs_register`],none:[`in_items`]},title:`もう一度、検証する`,text:[`「減ったのは1人あたりの金額」と、新しく手に入った数字のカードをセットして「検証する」を押そう。`],focus:`card:in_spend,card:ev_items`},{id:`c_why`,at:`hub`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`次の仮説へ`,text:[`裏付けが取れた。1人が買う数が減っている。新しく出た仮説「春に、売り場で何かが変わった」が、次の仮説になった。`,`この仮説を確かめるには、減り始めた頃の売り場のことを知る必要がある。◆ の付いた人に話を聞こう。`],focus:`talk`},{id:`c_talk`,at:`talk`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`誰に聞く？`,text:[`売り場のことは、毎日レジに立っている早瀬さんがいちばん詳しい。`],focus:`person:clerk`},{id:`c_hearing_shelf`,at:`scene`,when:{all:[`in_items`],none:[`ev_shelf`,`ev_shelf_owner`]},title:`変化の時期から聞く`,text:[`買う数が減り始めたのは4月。その頃に売り場で変わったことを聞いてみよう。`,`面談で聞けるのは3つまで。◆ の付いた質問は、いまの仮説を確かめられる。`]},{id:`c_hearing`,at:`scene`,when:{none:[`in_items`]},title:`面談の持ち時間`,text:[`面談で聞けるのは3つまで。◆ の付いた質問は、いまの仮説を確かめられる。`,`新しい材料を持って来れば、同じ人から聞ける話が増えることもある。`]},{id:`c_root_hint`,at:`board`,when:{all:[`in_items`],any:[`ev_shelf`,`ev_shelf_owner`,`ev_shelf_sales`],none:[`in_root`]},title:`最後の検証`,text:[`仮説「春に、売り場で何かが変わった」に、「ついで買いが消えた」と、春に売り場で変わったことのカードをセットして検証しよう。`],focus:`card:in_items,card:ev_shelf,card:ev_shelf_owner`},{id:`c_report`,at:`hub`,when:{all:[`in_root`]},title:`報告しよう`,text:[`真相にたどり着いた。いちばん下の「小松さんに報告する」が光っている。`,`報告では、原因と施策を選ぶ。合意したゴールを満たせるかも考えよう。`],focus:`report`},{id:`c_proposal`,at:`proposal`,title:`最終報告書をつくる`,text:[`コンサルタントの仕事は、最後に報告書で伝えるところまでだ。欄をタップして、集めたカードを並べていこう。`,`「現状の課題」には、調べて分かった「いま起きていること」を選ぶ（3つまで）。事実と食い違うことを書くと突っ込まれる。「原因の構造」には INSIGHT を、症状に近いものから根本原因へ順に。`,`「ご提案」は2つまで。費用が予算に収まるか、「実行スケジュール」で報告（3か月後）までに動き出すかも確かめよう。依頼人は、この順番で読んでいく。`],focus:`report-findings`},{id:`c_result`,at:`result`,title:`チュートリアル完了`,text:[`これでひと通り。次の CONSULTANT REVIEW で、自分の調べ方を振り返ってみよう。`,`本番の CASE 01 は、手がかりも関係者もずっと多い。健闘を祈る。`]}],review:{optimalActions:3,routes:[{label:`数字から`,steps:[`doc_register`,`ana_receipt`,`hear_clerk:cl_q_changes`],note:`客数と売上を並べて客単価の低下に気づき、レシートで買う数の減少を確かめ、変化の理由を現場に聞く。`},{label:`現場から`,steps:[`hear_clerk:cl_q_customers,cl_q_changes,cl_q_shelf`,`ana_receipt`],note:`レジに立つ人の実感から、客が減っていないことと春に棚をやめたことを聞き出し、レシートで買う数の減少を確かめる。`}],keyInvestigations:[`doc_register`,`ana_receipt`,`hear_clerk`],detourNotes:{obs_register:`レジ前の観察で、ついで買いが消えた様子は目で確かめられる。ただ、それが春に棚をやめたせいだと分かるのは、話を聞いてからだ。`,hear_baker:`店主の話からも棚のことは出てくる。ただ、店主は売り場の細かい変化を覚えていないことが多い。`},tips:[{when:{none:[`ev_customers`,`ev_regulars`]},text:`売上は「客数 × 1人あたりの金額」に分けられる。まず客数を確かめると、疑う先が半分になる。`},{when:{all:[`ev_goal`]},text:`「チラシで」は手段だった。依頼の言葉の奥にある目的を確かめると、選べる手が広がる。`}],truth:
