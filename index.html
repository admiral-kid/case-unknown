`,tone:`#1c2629`},{id:`break_room`,name:`休憩室`,background:`assets/backgrounds/break_room.jpg`,tone:`#27231f`},{id:`it_office`,name:`情報システム部`,background:`assets/backgrounds/it_office.jpg`,tone:`#1a2420`},{id:`product_office`,name:`商品企画部`,background:`assets/backgrounds/product_office.jpg`,tone:`#2a1d20`},{id:`corridor`,name:`本社 廊下`,background:`assets/backgrounds/corridor.jpg`,tone:`#1d1d20`}],evidence:[{id:`ev_inquiry`,type:`data`,title:`問い合わせ件数`,headline:`前年比 +3%`,description:`月間の問い合わせ件数。去年とほとんど変わっていない。`,source:`月次運営レポート`,tags:[`件数`,`業務量`]},{id:`ev_overtime`,type:`data`,title:`残業代`,headline:`前年比 +25%`,description:`オペレーターの残業代。年間3,200万円から4,000万円へ、およそ800万円の増加。`,source:`月次運営レポート`,tags:[`残業`,`コスト`]},{id:`ev_headcount`,type:`data`,title:`オペレーター人員数`,headline:`62名（±0%）`,description:`人は減っていない。去年と同じ62名で回している。`,source:`月次運営レポート`,tags:[`人員`]},{id:`ev_mgr_request`,type:`testimony`,title:`依頼：AIで人件費削減`,headline:`「AIでも使って、人件費を10%くらい下げられませんか？」`,description:`黒田部長の依頼。他社のAI活用事例を気にしている。`,source:`manager`,tags:[`依頼`,`AI`,`人件費`]},{id:`ev_mgr_goal`,type:`testimony`,title:`手段は問わない`,headline:`「要は人件費ですよ。やり方にこだわりはない」`,description:`AIそのものが目的ではない。経営会議で説明のつく形で人件費が下がればよい。`,source:`manager`,tags:[`依頼`,`目的`]},{id:`ev_budget`,type:`document`,title:`施策の予算と期限`,headline:`上限1,500万円／3か月後に報告`,description:`今期の施策に使える予算は1,500万円まで。3か月後の経営会議で結果を報告する。`,source:`黒田部長`,tags:[`予算`,`期限`]},{id:`ev_mgr_view`,type:`testimony`,title:`部長の見立て`,headline:`「現場の効率が落ちてるんじゃないか」`,description:`今年は新人が何人か入ったことを気にしている。現場の数字は細かく見ていない。`,source:`manager`,tags:[`新人`,`効率`]},{id:`ev_mgr_approved`,type:`testimony`,title:`部長は現場に任せていた`,headline:`「現場で対応できるならと、三浦に任せた」`,description:`記録項目の追加依頼は部長のもとを通っていたが、業務への影響は誰も確認しなかった。`,source:`manager`,tags:[`承認`,`組織`]},{id:`ev_mgr_no_staff`,type:`testimony`,title:`増員は論外`,headline:`「人件費を下げたいのに、人を増やしてどうする」`,description:`黒田部長は、人を増やす施策を受け入れるつもりがない。`,source:`manager`,tags:[`人員`,`依頼`]},{id:`ev_sv_aht_claim`,type:`testimony`,title:`処理時間が伸びている`,headline:`「一件あたりの処理時間が伸びてるんです」`,description:`三浦SVの実感。電話の本数が増えた感覚はない。`,source:`sv`,tags:[`処理時間`]},{id:`ev_aht`,type:`data`,title:`平均処理時間（AHT）`,headline:`8.2分 → 10.1分`,description:`1件の問い合わせを終えるまでの平均時間。前年比 +23%（+1.9分）。`,source:`月次運営レポート`,tags:[`処理時間`]},{id:`ev_sv_guess`,type:`testimony`,title:`SVの見立て`,headline:`「新人と、新商品の問い合わせのせいかも」`,description:`三浦SVは、新人の増加と新商品AERISの説明の難しさを疑っている。`,source:`sv`,tags:[`新人`,`新商品`]},{id:`ev_sv_quality`,type:`testimony`,title:`応対品質は落ちていない`,headline:`「品質評価はむしろ上がってます」`,description:`通話モニタリングの品質評価は前年より高い。`,source:`sv`,tags:[`品質`]},{id:`ev_sv_after_hours`,type:`testimony`,title:`受付終了後に残る理由`,headline:`「受付が終わっても、記録を片付けてる」`,description:`電話受付は18時で終わる。残業の多くは、その後の記録入力に使われている。`,source:`sv`,tags:[`残業`,`記録`]},{id:`ev_sv_rule_change`,type:`testimony`,title:`春の入力ルール変更`,headline:`「春に入力ルールが変わって、項目が増えました」`,description:`商品企画部からの依頼だと聞いている。SVには変更を断る権限がなかった。`,source:`sv`,tags:[`記録`,`商品企画`]},{id:`ev_op_after`,type:`testimony`,title:`電話より、その後がつらい`,headline:`「電話より終わった後の作業がつらい」`,description:`お客様と話すこと自体は苦ではない。負担は通話が終わった後にある。`,source:`operator`,tags:[`後処理`]},{id:`ev_op_fields`,type:`testimony`,title:`半年前から増えた入力`,headline:`「分析タグだけで40個以上。半年前から急に」`,description:`要約・転記・分類に加えて分析タグの入力。どれを選べばよいか迷うことが多い。`,source:`operator`,tags:[`後処理`,`記録`]},{id:`ev_op_veteran`,type:`testimony`,title:`遅いのはベテランも同じ`,headline:`「むしろベテランの方が遅いかも」`,description:`ベテランほど全項目をきちんと埋めようとする。`,source:`operator`,tags:[`新人`,`記録`]},{id:`ev_op_system`,type:`testimony`,title:`FAQもシステムも前と同じ`,headline:`「入力画面が縦に長くなったくらい」`,description:`FAQの使い勝手も画面の速さも変わらない。変わったのは入力画面の長さ。`,source:`operator`,tags:[`FAQ`,`システム`]},{id:`ev_op_briefing_session`,type:`testimony`,title:`商品企画部の説明会`,headline:`「説明会に、商品企画部の人が来てました」`,description:`記録項目の追加は『お客様の声を商品に活かすため』と説明された。`,source:`operator`,tags:[`記録`,`商品企画`]},{id:`ev_it_perf`,type:`data`,title:`CRMの応答速度`,headline:`0.8秒 → 0.8秒`,description:`画面の応答速度は前年と同じ。障害は0件。`,source:`システム稼働ログ`,tags:[`システム`]},{id:`ev_it_faq`,type:`testimony`,title:`FAQは3年間そのまま`,headline:`「FAQの仕組みは3年前から触ってません」`,description:`FAQ検索が遅いという報告もない。`,source:`it`,tags:[`FAQ`]},{id:`ev_it_changes`,type:`document`,title:`変更依頼票 CR-0417`,headline:`3月：応対記録画面に入力項目を8つ追加`,description:`依頼元：商品企画部。目的：新商品AERISの問い合わせ分析。『業務への影響』欄は空欄。`,source:`システム変更履歴`,tags:[`記録`,`商品企画`,`変更`]},{id:`ev_it_no_review`,type:`testimony`,title:`誰も入力時間を聞かなかった`,headline:`「入力時間？ 誰も聞いてこなかったですね」`,description:`IT部は要件どおりに作っただけ。入力の手間は、依頼元も業務部門も見積もっていない。`,source:`it`,tags:[`組織`,`記録`]},{id:`ev_pp_reason`,type:`testimony`,title:`項目を増やした理由`,headline:`「問い合わせ内容を分析したかったので」`,description:`新商品AERISの使い方で迷うポイントを知るため、記録項目の追加を依頼した。`,source:`product`,tags:[`商品企画`,`記録`]},{id:`ev_pp_unaware`,type:`testimony`,title:`入力時間は考えていなかった`,headline:`「……時間？ 考えていませんでした」`,description:`1件ごとの入力時間が増えることを、商品企画部は想定していなかった。センターからも何も言われなかった。`,source:`product`,tags:[`商品企画`,`組織`]},{id:`ev_pp_usage`,type:`testimony`,title:`使っているのは3項目`,headline:`「分析に使ってるのは3項目くらい」`,description:`追加した8項目のうち、実際に分析で使っているのは3つほど。タグは細かすぎて、集計時にまとめ直している。`,source:`product`,tags:[`商品企画`,`記録`]},{id:`ev_pp_open`,type:`testimony`,title:`見直しには前向き`,headline:`「欲しいのは傾向。全件じゃなくていい」`,description:`同じ目的を別の方法で達成できるなら、見直しに協力する意思がある。`,source:`product`,tags:[`商品企画`]},{id:`ev_service_level`,type:`data`,title:`応答率`,headline:`92% → 84%`,description:`かかってきた電話のうち、オペレーターが取れた割合。つながりにくくなっている。`,source:`月次運営レポート`,tags:[`顧客`,`待ち時間`]},{id:`ev_manual_rev`,type:`document`,title:`応対記録マニュアル v3.0`,headline:`3月改訂：必須入力 6項目 → 14項目`,description:`『分析タグ（42種）』を新設。改訂理由の欄には『商品企画部依頼（新商品AERISの顧客の声分析）』とある。`,source:`応対記録マニュアル`,tags:[`記録`,`商品企画`,`変更`]},{id:`ev_faq_log`,type:`data`,title:`FAQの利用ログ`,headline:`参照 1.2回 → 1.3回／件`,description:`1件あたりのFAQ参照回数も、平均検索時間（22秒→23秒）もほぼ横ばい。`,source:`FAQ利用ログ`,tags:[`FAQ`]},{id:`ev_newbie_ratio`,type:`data`,title:`入社1年未満の比率`,headline:`12% → 14%`,description:`新人の比率はわずかに上がった。研修時間は例年どおり。`,source:`人員構成・研修記録`,tags:[`新人`]},{id:`ev_breakdown`,type:`data`,title:`処理時間の内訳`,headline:`後処理 1.9分 → 3.4分`,description:`通話 4.6→5.0分（+0.4）／保留 1.7→1.7分（±0）／後処理 1.9→3.4分（+1.5）。伸びた1.9分のうち、約8割が後処理。`,source:`通話ログ分析`,tags:[`処理時間`,`後処理`]},{id:`ev_trend`,type:`data`,title:`後処理時間の月別推移`,headline:`3月に 2.0分 → 3.3分`,descripti
